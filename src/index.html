<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100d20">
  <title>Pexlora Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="browser-shell">
    <header class="chrome" id="chrome">
      <div class="tab-row" id="tabRow">
        <div class="brand" title="Pexlora Browser">
          <img class="brand-mark" src="../assets/pexlora-owl.webp" alt="">
          <span class="brand-name">Pexlora</span>
        </div>
        <div class="tabs" id="tabs" role="tablist" aria-label="Abas abertas"></div>
        <button class="new-tab icon-button" id="newTab" title="Nova guia (Ctrl+T)" aria-label="Nova guia">＋</button>
      </div>
      <div class="toolbar" id="toolbar">
        <div class="nav-controls">
          <button class="icon-button" id="back" title="Voltar (Alt+←)" aria-label="Voltar" disabled>←</button>
          <button class="icon-button" id="forward" title="Avançar (Alt+→)" aria-label="Avançar" disabled>→</button>
          <button class="icon-button" id="reload" title="Recarregar (Ctrl+R)" aria-label="Recarregar">↻</button>
          <button class="icon-button" id="home" title="Página inicial" aria-label="Página inicial">⌂</button>
        </div>
        <form class="address-form" id="addressForm">
          <span class="address-status" id="addressStatus" aria-hidden="true">⌕</span>
          <input id="address" type="text" autocomplete="off" spellcheck="false" placeholder="Pesquise ou digite um endereço...">
          <button class="address-bookmark" id="bookmark" type="button" title="Salvar nos favoritos" aria-label="Salvar nos favoritos">☆</button>
        </form>
        <div class="toolbar-actions">
          <button class="icon-button private-button" id="privateTab" title="Nova guia privada" aria-label="Nova guia privada">◐</button>
          <button class="icon-button" id="shields" title="Pexlora Shields" aria-label="Pexlora Shields">⛨</button>
          <button class="icon-button ai-button" id="ai" title="Pexlora AI" aria-label="Pexlora AI">AI</button>
          <button class="icon-button" id="menu" title="Menu do Pexlora" aria-label="Menu do Pexlora">···</button>
        </div>
      </div>
    </header>

    <main class="content-area" id="contentArea">
      <aside class="app-sidebar" id="appSidebar" aria-label="Navegação do Pexlora">
        <button class="sidebar-action active" data-sidebar="home" title="Início" aria-label="Início">
          <span class="sidebar-icon">⌂</span><span class="sidebar-label">Início</span>
        </button>
        <button class="sidebar-action" data-sidebar="bookmarks" title="Favoritos" aria-label="Favoritos">
          <span class="sidebar-icon">☆</span><span class="sidebar-label">Favoritos</span>
        </button>
        <button class="sidebar-action" data-sidebar="history" title="Histórico" aria-label="Histórico">
          <span class="sidebar-icon">◷</span><span class="sidebar-label">Histórico</span>
        </button>
        <button class="sidebar-action" data-sidebar="downloads" title="Downloads" aria-label="Downloads">
          <span class="sidebar-icon">↓</span><span class="sidebar-label">Downloads</span>
        </button>
        <div class="sidebar-divider"></div>
        <div class="sidebar-favorites-title">SALVOS</div>
        <div class="sidebar-favorites" id="sidebarFavorites"></div>
        <button class="sidebar-action sidebar-add" id="sidebarAddBookmark" title="Salvar site atual" aria-label="Salvar site atual">
          <span class="sidebar-icon">＋</span><span class="sidebar-label">Salvar site</span>
        </button>
        <div class="sidebar-spacer"></div>
        <button class="sidebar-action" data-sidebar="ai" title="Pexlora AI" aria-label="Pexlora AI">
          <span class="sidebar-icon">✦</span><span class="sidebar-label">Pexlora AI</span>
        </button>
        <button class="sidebar-action" data-sidebar="settings" title="Configurações" aria-label="Configurações">
          <span class="sidebar-icon">⚙</span><span class="sidebar-label">Configurações</span>
        </button>
        <button class="sidebar-theme" id="sidebarTheme" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro">
          <span id="sidebarThemeIcon">☾</span><span class="sidebar-label" id="sidebarThemeLabel">Tema escuro</span>
        </button>
      </aside>

      <section class="home-screen" id="homeScreen">
        <div class="home-inner">
          <div class="home-heading">
            <div class="home-brand">
              <img class="home-owl" src="../assets/pexlora-owl.webp" alt="Símbolo do Pexlora">
              <div class="home-wordmark">Pexlora</div>
              <div class="home-tagline">Explore sem limites</div>
            </div>
            <p class="home-greeting" id="greeting">Bem-vindo de volta.</p>
          </div>
          <form class="home-search" id="homeSearchForm">
            <span class="search-glass">⌕</span>
            <input id="homeSearch" type="text" placeholder="Pesquisar na web..." autocomplete="off" spellcheck="false">
            <button class="search-submit" type="submit" aria-label="Pesquisar">➜</button>
          </form>
          <section class="favorites-section">
            <div class="section-title-row">
              <h2>Seus sites</h2>
              <button id="manageFavorites" class="text-button">Gerenciar favoritos</button>
            </div>
            <div class="quick-links" id="quickLinks">
              <button class="quick-link" data-url="https://www.youtube.com" aria-label="Abrir YouTube"><span class="quick-icon youtube"><svg viewBox="0 0 48 34" aria-hidden="true"><rect x="1" y="1" width="46" height="32" rx="10" fill="#ff0033"/><path d="M20 10.2 33 17 20 23.8z" fill="#fff"/></svg></span><span>YouTube</span></button>
              <button class="quick-link" data-url="https://discord.com" aria-label="Abrir Discord"><span class="quick-icon discord"><svg viewBox="0 0 48 40" aria-hidden="true"><path fill="#5865f2" d="M9 6C18 2 30 2 39 6c5 7 7 15 7 24-6 5-12 7-18 8l-3-5 6-2c-8 3-15 3-23 0l6 2-3 5C5 36 2 33 2 30c0-9 2-17 7-24z"/><path fill="#fff" d="M17 16a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm14 0a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></span><span>Discord</span></button>
              <button class="quick-link" data-url="https://www.google.com" aria-label="Abrir Google"><span class="quick-icon google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285f4" d="M47 24.5c0-1.6-.1-3.2-.4-4.7H24v9h13a11 11 0 0 1-4.8 7.2v6h7.8C44.5 37.8 47 31.7 47 24.5z"/><path fill="#34a853" d="M24 48c6.5 0 12-2.2 16-6l-7.8-6c-2.2 1.5-5 2.4-8.2 2.4-6.3 0-11.7-4.2-13.6-9.9H2.4v6.2C6.4 42.6 14.5 48 24 48z"/><path fill="#fbbc05" d="M10.4 28.5a14.5 14.5 0 0 1 0-9V13.3H2.4a24 24 0 0 0 0 21.4z"/><path fill="#ea4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.8-6.8C35.9 2.3 30.5 0 24 0 14.5 0 6.4 5.4 2.4 13.3l8 6.2C12.3 13.7 17.7 9.5 24 9.5z"/></svg></span><span>Google</span></button>
              <button class="quick-link" data-url="https://github.com" aria-label="Abrir GitHub"><span class="quick-icon github"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M24 2C11.8 2 2 11.9 2 24.2c0 9.8 6.3 18.1 15.1 21 .1-1.6.1-3.9.1-5.6-6.1 1.3-7.4-2.6-7.4-2.6-1-2.5-2.5-3.1-2.5-3.1-2-.1-.2-1.2-.2-1.2 2.2.2 3.4 2.3 3.4 2.3 2 3.4 5.1 2.4 6.4 1.8.2-1.4.8-2.4 1.4-3-4.9-.6-10-2.5-10-10.9 0-2.4.9-4.4 2.3-6-.2-.6-1-2.9.2-6 0 0 1.9-.6 6.2 2.3a21 21 0 0 1 11.2 0c4.2-2.9 6.2-2.3 6.2-2.3 1.2 3.1.4 5.4.2 6 1.4 1.6 2.3 3.6 2.3 6 0 8.4-5.1 10.3-10 10.9.8.7 1.5 2 1.5 4.1v6.1C39.7 42.3 46 34 46 24.2 46 11.9 36.2 2 24 2z"/></svg></span><span>GitHub</span></button>
              <button class="quick-link" data-url="https://www.wikipedia.org" aria-label="Abrir Wikipedia"><span class="quick-icon wikipedia"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#fff" stroke="#9ca3af" stroke-width="2"/><path d="m7 15 4 1 7 17 5-12 5 12 9-18 4-1M17 16l-5 0m22 0-5 0" fill="none" stroke="#30343b" stroke-width="2.5" stroke-linecap="round"/></svg></span><span>Wikipedia</span></button>
              <button class="quick-link" data-url="https://www.reddit.com" aria-label="Abrir Reddit"><span class="quick-icon reddit"><svg viewBox="0 0 48 42" aria-hidden="true"><path fill="#ff4500" d="M24 5c-11 0-20 7-20 16s9 16 20 16 20-7 20-16S35 5 24 5z"/><path fill="#fff" d="M15 19a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm18 0a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM15 29c5 4 13 4 18 0-4 7-14 7-18 0z"/><path fill="#ff4500" d="m25 10 3-8 7 2-1 3-5-1-2 6z"/></svg></span><span>Reddit</span></button>
              <button class="quick-link" data-url="https://www.twitch.tv" aria-label="Abrir Twitch"><span class="quick-icon twitch"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#9146ff" d="M8 3H45v27L34 41H25l-7 6v-6H8z"/><path fill="#fff" d="M16 11h5v13h-5zm13 0h5v13h-5z"/></svg></span><span>Twitch</span></button>
            </div>
          </section>
          <div class="home-bottom">
            <div class="home-note"><span class="note-dot"></span><span>Seus favoritos e histórico ficam salvos neste dispositivo.</span></div>
            <button class="home-settings" id="openSettings">Personalizar página inicial</button>
          </div>
        </div>
      </section>

      <aside class="side-panel" id="sidePanel" aria-label="Painel lateral" hidden>
        <div class="panel-header">
          <div class="panel-heading"><div class="panel-title" id="panelTitle">Pexlora</div><div class="panel-subtitle" id="panelSubtitle">Seu navegador, do seu jeito</div></div>
          <button class="icon-button panel-close" id="panelClose" aria-label="Fechar painel" title="Fechar painel">×</button>
        </div>
        <div class="panel-content" id="panelContent"></div>
      </aside>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="confirm-backdrop" id="confirmBackdrop" hidden>
      <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <h2 id="confirmTitle">Confirmar ação</h2><p id="confirmMessage"></p>
        <div class="confirm-actions"><button class="secondary-button" id="confirmCancel">Cancelar</button><button class="primary-button" id="confirmAccept">Continuar</button></div>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
