name: Build Pexlora Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'main.js'
      - 'preload.js'
      - 'src/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pexlora-windows-installer
  cancel-in-progress: true

jobs:
  build:
    name: Build Pexlora Setup for Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pexlora-Windows-Installer
          path: dist/Pexlora-Setup-0.2.0.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: Pexlora Browser 0.2.0
          body: |
            Instalador do Pexlora Browser para Windows x64.

            Baixe `Pexlora-Setup-0.2.0.exe`, abra com dois cliques e siga o assistente.
            O usuário final não precisa instalar Node.js.
          files: dist/Pexlora-Setup-0.2.0.exe
          overwrite_files: true
          generate_release_notes: true
